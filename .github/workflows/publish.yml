name: 校验并发布学习内容

# 内容由助手在每日北京时间 08:00 的独立任务中生成并提交。
# Actions 只校验、构建和发布，不调用付费生成 API。
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: 构建静态网站
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: 读取待发布版本
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: 准备 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: 安装项目
        run: npm ci

      - name: 配置 GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: 校验并构建
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: npm test

      - name: 检查发布物
        shell: bash
        run: |
          test -f dist/index.html
          test -f dist/personal/index.html
          test -f dist/career/index.html
          test -f dist/content/identity-progress.json
          test -f dist/archive/index.html
          test -f dist/curriculum/index.html
          test -f dist/curriculum/consumer_psychology/index.html
          test -f dist/404.html
          test -f dist/content/latest.json
          test -f dist/content/curriculum.json
          test -f dist/content/progress.json
          test -f dist/assets/og.png

      - name: 上传 Pages 发布物
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: 发布到 GitHub Pages
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v4
